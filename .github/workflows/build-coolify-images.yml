# Buduje obrazy n8n i runners z gałęzi `build` forka i wypycha je do GHCR.
# Plik trafia do forka jako: .github/workflows/build-coolify-images.yml
#
# Tag obu obrazów: <wersja n8n z packages/cli/package.json>-<7 znaków SHA commita>,
# np. ghcr.io/jakubwilk/n8n:2.47.4-ec12419 i ghcr.io/jakubwilk/n8n-runners:2.47.4-ec12419.
# Oba obrazy powstają z tego samego commita, więc ich wersje zawsze się zgadzają
# (wymaganie n8n dla runnerów). Dodatkowo oba dostają ruchomy tag `prod`.
# Po buildzie z gałęzi build workflow wywołuje deploy usługi n8n w Coolify
# (jeśli istnieje sekret COOLIFY_TOKEN).
#
# Wersje akcji są przypięte do tych samych SHA, których używa upstream przy n8n@2.47.4.

name: Build Coolify images

on:
  push:
    branches: [build]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-coolify-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Tak jak w upstream CI (.github/workflows/docker-build-push.yml).
      NODE_OPTIONS: '--max-old-space-size=7168'
      NODE_VERSION: '26.13.0'
    steps:
      # Runner ma ograniczone miejsce na dysku, a build monorepo i obrazów jest duży.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read versions
        id: meta
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          PNPM_VERSION="$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '').split('+')[0]")"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pnpm=${PNPM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "n8n ${VERSION}, pnpm ${PNPM_VERSION}, tag ${VERSION}-${SHORT_SHA}"

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
          version: ${{ steps.meta.outputs.pnpm }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${{ steps.meta.outputs.pnpm }}"

      # scripts/build-n8n.mjs importuje `zx` z node_modules, zanim sam uruchomi
      # pnpm install, więc zależności muszą być zainstalowane wcześniej.
      # Te same flagi co w upstream (.github/actions/setup-nodejs, krok "Install Dependencies").
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build-n8n.mjs: pnpm install + build monorepo -> compiled/
      # dockerize-n8n.mjs: docker buildx bake (cele n8n i runners); nazwa z hostem
      # rejestru powoduje bezpośredni push.
      # Każdy obraz dostaje dwa tagi: niezmienny <wersja>-<sha7> (historia, rollback)
      # i ruchomy `prod`, którego używa compose usługi w Coolify.
      - name: Build and push images
        env:
          IMAGE_BASE_NAME: ghcr.io/${{ github.repository_owner }}/n8n
          RUNNERS_IMAGE_BASE_NAME: ghcr.io/${{ github.repository_owner }}/n8n-runners
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          N8N_TAGS: ghcr.io/${{ github.repository_owner }}/n8n:${{ steps.meta.outputs.tag }},ghcr.io/${{ github.repository_owner }}/n8n:prod
          RUNNERS_TAGS: ghcr.io/${{ github.repository_owner }}/n8n-runners:${{ steps.meta.outputs.tag }},ghcr.io/${{ github.repository_owner }}/n8n-runners:prod
          N8N_VERSION: ${{ steps.meta.outputs.version }}
          N8N_RELEASE_TYPE: stable
          DOCKER_PLATFORM: linux/amd64
        run: pnpm build:docker

      # Wdrożenie: tylko z gałęzi build i tylko gdy istnieje sekret COOLIFY_TOKEN
      # (token Coolify z uprawnieniem Deploy). Bez sekretu krok jest pomijany.
      # Coolify restartuje usługę: najpierw db-backup robi zrzut bazy, potem n8n
      # i worker startują z nowymi obrazami :prod (pull_policy: always w compose).
      - name: Deploy to Coolify
        id: deploy
        if: github.ref == 'refs/heads/build'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: https://coolify.underwolfstudio.com
          COOLIFY_SERVICE_UUID: 0gd7ymn3h6oyfxjycxsdghwg
        run: |
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "::notice::Brak sekretu COOLIFY_TOKEN, pomijam wdrożenie."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_SERVICE_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
          echo
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      # Deploy w Coolify jest asynchroniczny, więc najpierw czekamy, aż usługa się
      # zrestartuje, a potem sprawdzamy, czy n8n odpowiada. To wykrywa awarię po
      # wdrożeniu, ale nie potwierdza wersji (wersję sprawdza się `n8n --version`).
      - name: Wait for n8n health
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          sleep 120
          for i in $(seq 1 40); do
            if curl -fsS --max-time 10 https://ai-automation.underwolfstudio.com/healthz > /dev/null; then
              echo "n8n odpowiada (próba $i)."
              exit 0
            fi
            sleep 15
          done
          echo "::error::n8n nie odpowiada na /healthz po wdrożeniu."
          exit 1

      - name: Summary
        run: |
          {
            echo "### Obrazy"
            echo "- \`ghcr.io/${{ github.repository_owner }}/n8n:${{ steps.meta.outputs.tag }}\` (+ \`:prod\`)"
            echo "- \`ghcr.io/${{ github.repository_owner }}/n8n-runners:${{ steps.meta.outputs.tag }}\` (+ \`:prod\`)"
            echo ""
            echo "Wdrożenie w Coolify: ${{ steps.deploy.outputs.deployed || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"
